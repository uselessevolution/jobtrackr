springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
spring.application.name=jobtrackr-backend
spring.mongodb.uri=mongodb://localhost:27017/jobtrackr
jobtrackr.jwt.secret=${JWT_SECRET}
jobtrackr.jwt.expiration-ms=3600000
jobtrackr.reminder.scheduler.enabled=false
jobtrackr.reminder.scheduler.fixed-delay-ms=60000
jobtrackr.reminder.scheduler.batch-size=100

server.port=8080
# Email
jobtrackr.email.enabled=false
jobtrackr.email.from=${JOBTRACKR_EMAIL_FROM:no-reply@jobtrackr.local}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS_ENABLE:false}

spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
jobtrackr.reminder.max-attempts=${JOBTRACKR_REMINDER_MAX_ATTEMPTS:3}