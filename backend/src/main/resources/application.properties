springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
spring.application.name=jobtrackr-backend
spring.mongodb.uri=mongodb://localhost:27017/jobtrackr
jobtrackr.jwt.secret=${JWT_SECRET}
jobtrackr.jwt.expiration-ms=3600000
jobtrackr.reminder.scheduler.enabled=false
jobtrackr.reminder.scheduler.fixed-delay-ms=60000
jobtrackr.reminder.scheduler.batch-size=100
server.port=8080
